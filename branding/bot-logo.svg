<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="UTM Orar FCIM">
  <!-- Telegram crops bot avatars to a circle: everything important stays inside r=240 around the centre -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#242424" />
      <stop offset="1" stop-color="#0d0d0d" />
    </radialGradient>
    <clipPath id="card">
      <rect x="116" y="204" width="280" height="216" rx="34" />
    </clipPath>
  </defs>

  <rect width="512" height="512" fill="url(#bg)" />

  <!-- wordmark -->
  <text x="256" y="168" text-anchor="middle" font-family="'Arial Black', 'Segoe UI Black', Arial, sans-serif" font-weight="900" font-size="112" letter-spacing="6" fill="#f2f2f2">UTM</text>

  <!-- calendar card -->
  <rect x="116" y="204" width="280" height="216" rx="34" fill="#1b1b1b" />
  <g clip-path="url(#card)">
    <rect x="116" y="204" width="280" height="44" fill="#2c2c2c" />
  </g>
  <rect x="116" y="204" width="280" height="216" rx="34" fill="none" stroke="#3d3d3d" stroke-width="6" />
  <text x="256" y="236" text-anchor="middle" font-family="'Arial Black', 'Segoe UI Black', Arial, sans-serif" font-weight="900" font-size="22" letter-spacing="5" fill="#a8a8a8">FCIM</text>

  <!-- binding rings -->
  <rect x="172" y="186" width="20" height="40" rx="10" fill="#ececec" />
  <rect x="320" y="186" width="20" height="40" rx="10" fill="#ececec" />

  <!-- timetable blocks: curs (blue), seminar (amber), lab (green), project (purple) -->
  <g>
    <rect x="140" y="266" width="38" height="46" rx="8" fill="#6f9df0" />
    <rect x="140" y="322" width="38" height="42" rx="8" fill="#4fbf9c" />

    <rect x="188" y="282" width="38" height="52" rx="8" fill="#e0a93b" />
    <rect x="188" y="344" width="38" height="44" rx="8" fill="#a98be0" />

    <rect x="236" y="266" width="38" height="54" rx="8" fill="#4fbf9c" />
    <rect x="236" y="330" width="38" height="40" rx="8" fill="#6f9df0" />

    <rect x="284" y="274" width="38" height="42" rx="8" fill="#a98be0" />
    <rect x="284" y="326" width="38" height="54" rx="8" fill="#e0a93b" />

    <rect x="332" y="266" width="38" height="58" rx="8" fill="#6f9df0" />
    <rect x="332" y="334" width="38" height="44" rx="8" fill="#4fbf9c" />
  </g>
</svg>
