name: Sync timetable and deploy

on:
  # Refresh the timetable (and the .ics calendars) from the FCIM page every 6 hours
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer run supersedes an older one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Scrapes the live page into public/data/schedule.json and rebuilds public/ics/*.ics.
      # The site may refuse requests from GitHub's servers (403) or change its layout; in that case the
      # build carries on with the data committed to the repo instead of failing the whole deployment.
      - name: Sync timetable
        id: sync
        continue-on-error: true
        run: npm run sync

      - name: Warn that the timetable is not fresh
        if: steps.sync.outcome == 'failure'
        run: echo "::warning title=Timetable sync failed::Deploying the timetable data committed to the repo instead."

      - uses: actions/configure-pages@v5
        id: pages

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
